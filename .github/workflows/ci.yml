name: CI

# A prose-only change cannot break a typecheck or a test, so skip both jobs
# for it. paths-ignore only skips when *every* changed file matches, so a
# commit that touches code as well still runs in full.
#
# pull_request alone, deliberately. Running on push as well meant every
# push to a branch with an open pull request built the same commit twice.
# pull_request is the half worth keeping: it tests the merge with main
# rather than the branch head in isolation, so it catches the conflict that
# only appears once the two sides meet — and main now requires a pull
# request, so nothing reaches it without passing through here anyway.
#
# The cost: a branch with no pull request open gets no CI. Open it as a
# draft to get it back.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test
