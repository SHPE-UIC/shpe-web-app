# Terraform for the GCP project.
#
# Plans run automatically so a reviewer can see what an infra pull request
# would actually do. Applying is deliberately not automatic: this workflow's
# service account can grant project IAM roles, so it runs only when somebody
# starts it by hand, through the `infra` environment.
name: Infrastructure

# Planning Terraform to review a prose edit wastes a WIF exchange and two
# minutes, so a pull request that touches no .tf still reports `plan` without
# doing any of that — the decision is the `scope` step below, not a filter.
#
# It cannot be a filter: `main` requires `plan` to pass, and a workflow that
# never starts never reports. A required check that never reports is not
# "passed", it is pending forever, which left every non-infra pull request
# permanently unmergeable. `pull_request` is therefore unfiltered.
#
# `push` keeps its filter: it produces no required check, so skipping it
# entirely costs nothing.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '!infra/**.md'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the plan (unchecked = plan only)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: infra

env:
  # Terraform reads these instead of a committed terraform.tfvars, which stays
  # gitignored because it names the calendar and the alert address.
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_google_calendar_id: ${{ vars.GOOGLE_CALENDAR_ID }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      # Runs before the checkout, so it overrides the `infra` working
      # directory this file sets by default — that directory does not exist
      # yet. Every later step is guarded on its verdict rather than the job
      # being skipped: a skipped job reports the "skipped" conclusion, and
      # whether a ruleset accepts that in place of a passing one is a detail
      # worth not depending on.
      - name: Does this run need Terraform?
        id: scope
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Anything not a pull request — a dispatch, or a push to main that
          # already passed the path filter — always plans.
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "Verdict: ${{ github.event_name }} — planning."
            exit 0
          fi

          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          echo "Changed files:"
          echo "$files" | sed 's/^/  /'

          # An infra/ file that is not markdown, or this workflow itself.
          if echo "$files" | grep -E '^infra/' | grep -qvE '\.md$'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Verdict: Terraform changed — planning.'
          elif echo "$files" | grep -qxF '.github/workflows/infra.yml'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Verdict: this workflow changed — planning.'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Verdict: no Terraform touched — reporting success without planning.'
          fi

      - uses: actions/checkout@v4
        if: steps.scope.outputs.run == 'true'

      - uses: google-github-actions/auth@v2
        if: steps.scope.outputs.run == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.scope.outputs.run == 'true'
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - run: terraform init -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"
        if: steps.scope.outputs.run == 'true'

      - run: terraform fmt -check -recursive
        if: steps.scope.outputs.run == 'true'

      - run: terraform validate
        if: steps.scope.outputs.run == 'true'

      # `show` on the saved plan, rather than the plan's own stdout, so the
      # comment is the diff itself and not a hundred "Refreshing state" lines.
      - name: Plan
        if: steps.scope.outputs.run == 'true'
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      # The plan is the whole point of running this on a pull request, so put
      # it where the reviewer already is instead of behind a log link.
      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request' && steps.scope.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const body = [
              '### Terraform plan',
              '',
              '```terraform',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n… truncated, see the job log' : plan,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.run == 'true'
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 5

  apply:
    # Manual only, and only when the box was ticked. Dispatches always plan
    # for real above, so this never follows a skipped plan. The environment
    # requires one of its reviewers to approve, and it only accepts `main`.
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    needs: plan
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - run: terraform init -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"

      # Re-planned rather than applying the artifact from the plan job: a
      # saved plan is rejected if anything changed underneath it, and the
      # error that produces is far less clear than simply planning again.
      - run: terraform apply -auto-approve -no-color
