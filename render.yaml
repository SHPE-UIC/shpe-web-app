# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New > Blueprint, pick this repo, and it reads this file instead of
# you filling in a form. Values marked `sync: false` are the ones Render will
# prompt you for; nothing secret is committed here.

services:
  - type: web
    name: shpe-api
    runtime: node
    plan: free
    region: oregon
    branch: main

    # Migrations run as part of the build, so a deploy whose schema cannot be
    # applied fails loudly instead of starting a server against the wrong
    # tables. Both tsx and drizzle-orm are runtime dependencies, which matters
    # because Render sets NODE_ENV=production and npm then skips devDependencies.
    buildCommand: npm install && npm run db:migrate
    startCommand: npm start

    # Render pings this after a deploy to decide whether the service came up.
    # It is deliberately the shallow check, not /healthz/db.
    healthCheckPath: /healthz

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Neon pooled connection string, from the Vercel dashboard.
      - key: DATABASE_URL
        sync: false

      # Generated by Render — nobody has to invent it, and it never appears in
      # this file or in chat. Regenerating it signs every member out.
      - key: JWT_SECRET
        generateValue: true

      # Comma-separated Vercel origins allowed to call this API. Set this after
      # the Vercel project exists and you know its URL.
      - key: CORS_ORIGINS
        sync: false

      - key: SESSION_TTL
        value: 7d
      - key: CHECKIN_TOKEN_TTL_SECONDS
        value: "60"

      # Google Calendar sync. Leave unset until Phase 4 lands — the API boots
      # fine without them and the sync reports a clear error if asked to run.
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CALENDAR_SYNC_INTERVAL_MINUTES
        value: "15"

      # Protects POST /api/sync/calendar from anyone who finds the URL.
      - key: SYNC_SECRET
        generateValue: true
